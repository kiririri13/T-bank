name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Generate Config
      run: npm run build:pages
      env:
        API_BASE_URL: https://tbank-loyalty-hub-api.onrender.com

    - name: Setup Capacitor Android
      run: npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Fix Kotlin Duplicate Classes
      run: |
        echo "allprojects { configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' } }" >> android/build.gradle

    - name: Set App Icons
      run: |
        SRC="public/icon-512.png"
        MIPMAP="android/app/src/main/res"
        declare -A SIZES=(
          [mipmap-mdpi]=48
          [mipmap-hdpi]=72
          [mipmap-xhdpi]=96
          [mipmap-xxhdpi]=144
          [mipmap-xxxhdpi]=192
        )
        for dir in "${!SIZES[@]}"; do
          size="${SIZES[$dir]}"
          mkdir -p "$MIPMAP/$dir"
          convert "$SRC" -resize "${size}x${size}" "$MIPMAP/$dir/ic_launcher.png"
          convert "$SRC" -resize "${size}x${size}" "$MIPMAP/$dir/ic_launcher_round.png"
          convert "$SRC" -resize "${size}x${size}" "$MIPMAP/$dir/ic_launcher_foreground.png"
        done

    - name: Build APK
      working-directory: ./android
      run: |
        ./gradlew assembleDebug
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/t-bank-loyalty-hub.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: t-bank-loyalty-hub-apk
        path: android/app/build/outputs/apk/debug/t-bank-loyalty-hub.apk
